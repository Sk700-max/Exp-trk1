<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Cache Inspector</title>
</head>
<body>
  <h2>Expense Cache Inspector</h2>
  <p>This only reads cached responses. It does not delete anything.</p>
  <button id="check">Inspect cache</button>
  <pre id="result">Waiting…</pre>

  <script>
    document.getElementById("check").onclick = async function () {
      const out = document.getElementById("result");
      const lines = [];

      try {
        const names = await caches.keys();

        if (!names.length) {
          out.textContent = "No caches found.";
          return;
        }

        for (const name of names) {
          const cache = await caches.open(name);
          const requests = await cache.keys();

          lines.push("CACHE: " + name);
          lines.push("Cached items: " + requests.length);

          for (const request of requests) {
            const response = await cache.match(request);
            let size = "unknown";

            if (response) {
              try {
                const copy = response.clone();
                const blob = await copy.blob();
                size = blob.size + " bytes";
              } catch (e) {}
            }

            lines.push(request.url + " — " + size);
          }

          lines.push("");
        }

        out.textContent = lines.join("\n");
      } catch (e) {
        out.textContent = "Could not inspect cache: " + e.message;
      }
    };
  </script>
</body>
</html>
